{% set version = "0.7.0" %}
{% set sha256 = "41ba13991982b0304520bf5115491d63f644389552eea62fc2ecbd21ef661001" %}

package:
  name: slycot
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/slycot/slycot-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - scikit-build-core >=0.12.1             # [build_platform != target_platform]
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cmake >=3.17
    - make  # [unix]
    - ninja  # [win]
  host:
    - libblas
    - libcblas
    - liblapack
    - python
    - numpy
    - scikit-build-core >=0.12.1
    - pip
    - setuptools_scm >=9
  run:
    - python

test:
  requires:
    - pytest
    - scipy
  imports:
    - slycot
  commands:
    - pytest --pyargs slycot

about:
  home: https://github.com/python-control/Slycot
  dev_url: https://github.com/python-control/Slycot
  license: GPL-2.0-only
  license_family: GPL
  license_file: LICENSE.txt
  summary: 'Slycot: a wrapper for the SLICOT control and systems library'
  description: |
    Slycot wraps the SLICOT library which is used for control and systems
    analysis.

extra:
  recipe-maintainers:
    - roryyorke
    - bnavigator
    - moorepants
    - murrayrm
    - repagh
